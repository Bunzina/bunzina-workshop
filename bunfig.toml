[test]
root = "."
preload = ["./src/test/setup.ts"]
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "./coverage"
coverageThreshold = { lines = 0.8, functions = 0.8, statements = 0.8, branches = 0.8 }
coverageSkipTestFiles = true
pathIgnorePatterns = [
  "**/node_modules/**",
  "**/dist/**",
  "**/coverage/**",
  "**/src/test/**",
  "**/infrastructure/configs/**",
]
coveragePathIgnorePatterns = [
  "**/node_modules/**",
  "**/dist/**",
  "**/coverage/**",
  "**/migrations/**",
  "**/src/test/**",
  "**/infrastructure/configs/**",
]
