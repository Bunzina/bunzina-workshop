name: Deploy to Kubernetes (EKS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: bunzina-workshop
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'bunzina-eks' }}
  K8S_NAMESPACE: bunzina
  HELM_RELEASE: bunzina-workshop

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests with coverage
        run: bun test --config=./bunfig.ci.toml

  migrate-prod:
    name: Run Production Migrations
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      # Cada serviço tem o seu próprio Postgres (ADR 0012). O Service do banco
      # deste serviço é `bunzina-workshop-postgres` no namespace bunzina.
      - name: Run production migrations
        env:
          APP_ENV: prod
          DB_SERVICE: ${{ vars.DB_SERVICE || 'bunzina-workshop-postgres' }}
          DB_NAME: ${{ vars.DB_NAME || 'bunzina-workshop' }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl port-forward -n "$K8S_NAMESPACE" "svc/${DB_SERVICE}" 5432:5432 &
          PF_PID=$!
          trap 'kill $PF_PID' EXIT

          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then break; fi
            sleep 1
          done

          export PROD_DATABASE_URL="postgres://${DB_USER}:${DB_PASSWORD}@127.0.0.1:5432/${DB_NAME}"

          bun run migration

  deploy:
    name: Build & Deploy to EKS
    runs-on: ubuntu-latest
    needs:
      - test
      - migrate-prod
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null

      - name: Build, tag and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Log in to ECR for Helm (OCI)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | helm registry login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Inject AWS account ID into chart dependency
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          sed -i "s/__AWS_ACCOUNT_ID__/${AWS_ACCOUNT_ID}/g" \
            charts/bunzina-workshop-chart/Chart.yaml \
            charts/bunzina-workshop-chart/values.yaml

      - name: Resolve app-chart dependency from OCI
        run: helm dependency update charts/bunzina-workshop-chart

      - name: Deploy with Helm
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          DB_SERVICE: ${{ vars.DB_SERVICE || 'bunzina-workshop-postgres' }}
          DB_NAME: ${{ vars.DB_NAME || 'bunzina-workshop' }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
        run: |
          helm upgrade --install "$HELM_RELEASE" charts/bunzina-workshop-chart \
            --namespace "$K8S_NAMESPACE" --create-namespace \
            --set app-chart.app.image.repository="${ECR_REGISTRY}/${ECR_REPOSITORY}" \
            --set app-chart.app.image.tag="$IMAGE_TAG" \
            --set app-chart.app.config.PROD_DB_HOST="$DB_SERVICE" \
            --set app-chart.app.config.PROD_DB_NAME="$DB_NAME" \
            --set app-chart.app.secret.PROD_DB_USER="$DB_USER" \
            --set app-chart.app.secret.PROD_DB_PASSWORD="$DB_PASSWORD" \
            --set app-chart.app.secret.RABBITMQ_URL="$RABBITMQ_URL" \
            --wait --timeout 10m

      - name: Verify rollout
        run: kubectl rollout status deployment/bunzina-workshop -n "$K8S_NAMESPACE" --timeout=180s
