name: Deploy to Kubernetes (EKS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: bunzina-workshop
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'bunzina-eks' }}
  K8S_NAMESPACE: bunzina
  HELM_RELEASE: bunzina-workshop

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests with coverage
        run: bun test --config=./bunfig.ci.toml

  ensure-indexes:
    name: Ensure Mongo Indexes
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # O Atlas é alcançado pela internet, não pelo cluster: não há
      # port-forward aqui. O IP de saída do runner precisa estar na allowlist.
      - name: Ensure indexes
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || 'bunzina-workshop' }}
        run: bun run ensure-indexes

  deploy:
    name: Build & Deploy to EKS
    runs-on: ubuntu-latest
    needs:
      - test
      - ensure-indexes
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null

      - name: Build, tag and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Log in to ECR for Helm (OCI)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | helm registry login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Inject AWS account ID into chart dependency
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          sed -i "s/__AWS_ACCOUNT_ID__/${AWS_ACCOUNT_ID}/g" \
            charts/bunzina-workshop-chart/Chart.yaml \
            charts/bunzina-workshop-chart/values.yaml

      - name: Resolve app-chart dependency from OCI
        run: helm dependency update charts/bunzina-workshop-chart

      - name: Deploy with Helm
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
        run: |
          helm upgrade --install "$HELM_RELEASE" charts/bunzina-workshop-chart \
            --namespace "$K8S_NAMESPACE" --create-namespace \
            --set app-chart.app.image.repository="${ECR_REGISTRY}/${ECR_REPOSITORY}" \
            --set app-chart.app.image.tag="$IMAGE_TAG" \
            --set app-chart.database.enabled=false \
            --set app-chart.app.secret.MONGODB_URI="$MONGODB_URI" \
            --set app-chart.app.secret.RABBITMQ_URL="$RABBITMQ_URL" \
            --wait --timeout 10m

      - name: Verify rollout
        run: kubectl rollout status deployment/bunzina-workshop -n "$K8S_NAMESPACE" --timeout=180s
