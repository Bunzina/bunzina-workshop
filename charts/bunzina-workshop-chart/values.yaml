app-chart:
  namespace: bunzina

  app:
    name: bunzina-workshop
    image:
      repository: __AWS_ACCOUNT_ID__.dkr.ecr.us-east-1.amazonaws.com/bunzina-workshop
      tag: ""
      pullPolicy: IfNotPresent
    replicaCount: 2
    containerPort: 3000
    service:
      type: ClusterIP
      port: 80
    # API interna da oficina: alcançada por port-forward na demonstração,
    # o que poupa um ALB da cota do Learner Lab.
    ingress:
      enabled: false
      className: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/healthcheck-path: /health
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPU: 70
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
    probes:
      path: /health
      livenessPath: /health
      readinessPath: /ready
    metrics:
      enabled: true
      path: /metrics
      port: 3000
      serviceMonitor:
        enabled: true
        interval: 15s
        scrapeTimeout: 10s
    config:
      APP_ENV: "prod"
      MONGODB_DB: "bunzina-workshop"
      RABBITMQ_EXCHANGE: "bunzina.events"
      RABBITMQ_QUEUE: "bunzina-workshop.inbox"
      # Aponta para o release `bunzina-observability` (namespace `observability`).
      # Sem essa env var o tracing.ts nem inicializa.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy-gateway.observability.svc.cluster.local:4318"
      OTEL_SERVICE_NAME: "bunzina-workshop"

  # Este serviço usa o MongoDB Atlas M0, fora do cluster (ADR 0014). Não há
  # banco para o app-chart subir.
  database:
    enabled: false
