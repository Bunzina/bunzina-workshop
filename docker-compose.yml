services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - /app/.bun
    environment:
      - APP_ENV=dev
      - MONGODB_URI=mongodb://bun:bun@mongo:27017/bunzina-workshop?authSource=admin
      - MONGODB_DB=bunzina-workshop
      - RABBITMQ_URL=amqp://bunzina:bunzina@rabbitmq:5672
      - RABBITMQ_EXCHANGE=bunzina.events
      - RABBITMQ_QUEUE=bunzina-workshop.inbox
      - OTEL_SERVICE_NAME=bunzina-workshop
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ['bun', 'run', 'start:dev']

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: bun
      MONGO_INITDB_ROOT_PASSWORD: bun
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: bunzina
      RABBITMQ_DEFAULT_PASS: bunzina
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
